# =============================================================================
# fake_addresses.yaml -- parts for synthetic back-side (address) values.
#
# Addresses are assembled at random from the parts below:
#   ঠিকানা: [বাসা/হোল্ডিং: <house>,] [গ্রাম/রাস্তা: <village/road>,]
#           ডাকঘর: <post office> - <post code>, <upazila>, [<city/pourashava>,] <district>
# The upazilas and post-code ranges are public geography; house numbers,
# villages and post offices are combined at random, so no output is a real
# person's address. Nothing is read from the source cards.
# =============================================================================

label: "ঠিকানা:"

# Probability that each optional part appears.
probabilities:
  house: 0.45            # বাসা/হোল্ডিং part
  house_no_colon: 0.15   # "বাসা/হোল্ডিং ৮৭" instead of "বাসা/হোল্ডিং: ৮৭"
  village: 0.85          # গ্রাম/রাস্তা part
  post_code: 0.9         # " - ৮২০০" after the post office
  pourashava: 0.25       # "<upazila> পৌরসভা" (not used with a city corporation)
  city_corp: 0.6         # for districts that have one, when the district is picked

# --- house / holding numbers --------------------------------------------------
house_formats:           # {n} 1-999, {m} 1-30, {L} letter, {k} 1-9
  - "{n}"
  - "{n}/{m}"
  - "{n}/{L}"
  - "{L}-{k}/{L}-{k}"
  - "{n}, {L}"
  - "{n}/{m}/{L}"
  - "{L}-{n}"
  - "{n}/{m}(নতুন)"
  - "{n}(পুরাতন)"
house_letters: [এ, বি, সি, ডি, ই, ক, খ, গ]

# --- villages / roads -----------------------------------------------------------
village_prefix: ["", "", "", "উত্তর ", "দক্ষিণ ", "পূর্ব ", "পশ্চিম ", "মধ্য ", "চর "]
village_base:
  - রায়পুরা
  - চরপাড়া
  - কাজীপাড়া
  - মিয়াপাড়া
  - হাজীপাড়া
  - নয়াপাড়া
  - বড়বাড়ী
  - ছোটবাড়ী
  - কাশিপুর
  - রামপুর
  - শ্যামপুর
  - গোপালপুর
  - কৃষ্ণপুর
  - হরিপুর
  - মাধবপুর
  - শিবপুর
  - নবীনগর
  - বাগবাড়ী
  - চান্দপুর
  - দৌলতপুর
  - জয়নগর
  - বালিয়াকান্দি
  - কুমারখালী
  - আমতলা
  - বটতলা
  - তালতলা
  - নারিকেলবাড়িয়া
  - মোল্লাপাড়া
  - সরকারপাড়া
  - কলোনী
village_suffix: ["", "", "", " গ্রাম", " আবাসিক এলাকা", " নতুন পাড়া", " পুরাতন পাড়া"]
bari_families: [বেপারী, মিয়া, কাজী, হাজী, খান, শেখ, চৌধুরী, পাটোয়ারী, মোল্লা, সরকার, মুন্সী, তালুকদার, প্রামানিক, মন্ডল, দাস]
road_formats:            # {n} 1-30, {name} village base
  - "{n} নং রোড"
  - "{name} রোড"
  - "{name} লেন"
  - "{n} নং গলি"
  - "{name} সড়ক"
  - "সেক্টর-{n}"
road_fraction: 0.3       # share of গ্রাম/রাস্তা values that are a road
bari_fraction: 0.2       # share that are "<family> বাড়ী"

# --- districts ------------------------------------------------------------------
# post_code: [first, last] of the range drawn from.
